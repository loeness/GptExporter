<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GptExporter</title><link rel="stylesheet" href="styles/popup.css"><script src="src/popup.js" defer></script></head>
<body>
  <header><img src="icons/icon48.png" width="40" height="40" alt=""><div><strong>GptExporter</strong><span>把有价值的对话留下来</span></div></header>
  <main><h1>从对话，到文档。</h1><p>选择消息，整理预览，然后导出你需要的格式。</p>
  <div class="formats" aria-label="支持的格式"><span>PDF</span><span>Markdown</span><span>TXT</span><span>HTML</span><span>JSON</span></div>
  <button id="open" type="button">预览当前对话 <span aria-hidden="true">↗</span></button>
  <p id="status" role="status" aria-live="polite">请先打开 ChatGPT 中的一段对话。</p>
  <p class="hint">仅读取页面已加载的消息。较长对话请先向上滚动加载，再打开预览。</p></main>
  <footer><span class="dot"></span>本地处理 · 无需登录 · 无上传</footer>
</body></html>
